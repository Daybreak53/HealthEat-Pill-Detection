# W&B 및 모델 설정
wandb_project: "HealthEat-Pill-Detection"
wandb_entity: "team5pj1"
wandb_run_name: "yolov11n_baseline"
model_name: "yolo11n.pt"

# 학습 하이퍼파라미터
epochs: 20
imgsz: 640
batch: 16
device: "cuda"
workers: 2
seed: 42
patience: 10

# 경로 설정
data_yaml: "data/dataset/data.yaml"
train_img_dir: "data/sprint_ai_project1_data/train_images"
train_json_dir: "data/sprint_ai_project1_data/train_annotations"
test_img_dir: "data/sprint_ai_project1_data/test_images"
dataset_dir: "data/dataset" 
submission_csv: "team5_submission.csv"

# 전처리 및 기타 설정
inv_class_mapping:
  0: 1
  1: 2
img_size: 640
bbox_margin: 0.1
split_ratio: [0.8, 0.1, 0.1]
use_code_as_classname: false
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 30
translate: 0.1
scale: 0.5
fliplr: 0.5
flipud: 0.5
mosaic: 1.0
mixup: 0.2
